name: "Spice Labs Surveyor"
description: "Runs The Spice Labs Surveyor to survey files and upload results."

inputs:
  subject:
    description: "Label identifying the system being surveyed (shown on the dashboard). Required for local files; for an image it defaults to the image name without its tag"
    required: false
    default: ""
  input:
    description: "Path to local files to survey (ignored when `image` is set)"
    required: false
    default: "."
  image:
    description: "OCI/Docker registry image reference to survey (instead of local files), e.g. `ghcr.io/org/app:v1`. Requires a Surveyor CLI release with docker:// inputs (see README)."
    required: false
    default: ""
  spice_pass:
    description: "Spice Pass token, passed from a secret. The action stops at its first step when it is empty"
    required: true
  cli_image:
    description: "Docker image for the CLI"
    required: false
    default: "spicelabs/spice-labs-cli"
  cli_image_tag:
    description: "Tag added to `cli_image` when it has no tag or digest, e.g. `1.9.3`. Without it the image's `latest` runs. Ignored, with a warning, when `cli_image` already has a tag or digest"
    required: false
    default: ""
  log_level:
    description: "Log level: debug|info|warn|error"
    required: false
    default: "info"

runs:
  using: "composite"
  steps:
    - name: Check inputs
      id: check
      shell: bash
      env:
        HAS_SPICE_PASS: ${{ inputs.spice_pass != '' }}
        CLI_IMAGE: ${{ inputs.cli_image }}
        CLI_IMAGE_TAG: ${{ inputs.cli_image_tag }}
      run: |
        if [ "$HAS_SPICE_PASS" != "true" ]; then
          echo "::error title=spice_pass is empty::The spice_pass input is required but is empty. Pass a Spice Pass from a repository secret, and check that the secret exists and this workflow can read it. To create a Spice Pass, see https://docs.spicelabs.io/docs/topographer/credentials/#generate-a-spice-pass"
          exit 1
        fi
        spice_image="$CLI_IMAGE"
        if [ -n "$CLI_IMAGE" ] && [ -n "$CLI_IMAGE_TAG" ]; then
          # Only the last path segment can hold a tag: a registry host may carry a port.
          case "${CLI_IMAGE##*/}" in
            *:*|*@*) echo "::warning title=cli_image_tag ignored::cli_image ($CLI_IMAGE) already has a tag or digest, so cli_image_tag ($CLI_IMAGE_TAG) was ignored" ;;
            *) spice_image="$CLI_IMAGE:$CLI_IMAGE_TAG" ;;
          esac
        fi
        echo "spice_image=$spice_image" >> "$GITHUB_OUTPUT"
    - name: Install Spice Labs Surveyor CLI
      shell: bash
      run: |
        curl -sSLf https://install.spicelabs.io | bash
    - name: Run Spice Labs Surveyor
      shell: bash
      run: |
        set -e
        export SPICE_PASS="${{ inputs.spice_pass }}"
        export SPICE_IMAGE="${{ steps.check.outputs.spice_image }}"
        export SPICE_IMAGE_TAG="${{ inputs.cli_image_tag }}"
        IMG="${{ inputs.image }}"
        SUBJECT="${{ inputs.subject }}"

        if [ -n "$IMG" ]; then
          case "$IMG" in
            docker://*|oci://*) ;;
            *) IMG="docker://$IMG" ;;
          esac
          ~/.local/bin/spice survey inventory ${SUBJECT:+"$SUBJECT"} "$IMG" --log-level="${{ inputs.log_level }}"
        else
          if [ -z "$SUBJECT" ]; then
            echo "::error::subject is required when surveying local files"
            exit 1
          fi
          ~/.local/bin/spice survey inventory "$SUBJECT" "${{ inputs.input }}" --log-level="${{ inputs.log_level }}"
        fi
